<title>Rapports d'intervention — REGUL'AIR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gr:#20262A;--paper:#F7F4EC;--bg:#EBE3CE;--ink:#262F33;--soft:#6B7378;
  --amber:#E0992F;--amber2:#BD7E22;--rust:#B6502E;--line:#DCD1B0;--r:10px;
  --fb:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fm:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);}
/* BAR */
.bar{position:sticky;top:0;z-index:30;background:#fff;color:var(--ink);border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 22px;}
.brand{display:flex;align-items:center;font-family:var(--fm);font-weight:600;font-size:15px;color:#fff;}
.spacer{flex:1;}
/* BUTTONS */
.btn{border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;transition:all .12s;}
.btn:active{transform:translateY(1px);}
.btn.amber{background:var(--amber);color:var(--gr);}
.btn.amber:hover{background:var(--amber2);}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn.ghost:hover{border-color:var(--soft);}
.btn.red{background:var(--rust);color:#fff;}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:6px;}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:7px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.icon-btn:hover{background:var(--bg);}
/* PAGE */
.page{max-width:980px;margin:0 auto;padding:24px 20px 80px;}
/* LIST */
.toolbar{display:flex;gap:10px;margin-bottom:18px;}
.sw{flex:1;min-width:200px;position:relative;}
.sw input{width:100%;padding:10px 13px 10px 36px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);}
.sw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--soft);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s;cursor:pointer;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(32,38,42,.35);}
.cref{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--soft);}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.br{background:var(--amber);color:var(--gr);}
.bs{background:transparent;color:var(--rust);border:1.5px solid var(--rust);}
.bn{background:transparent;color:var(--soft);text-decoration:line-through;border:1.5px solid var(--line);}
.ba{background:transparent;color:var(--soft);border:1.5px dashed var(--soft);}
.csite{font-weight:700;font-size:16px;}
.cdate{font-family:var(--fm);font-size:12px;color:var(--soft);}
.cact{display:flex;gap:7px;}
.cact .btn{flex:1;justify-content:center;}
.ico{flex:0 0 auto;width:34px;height:34px;padding:0;justify-content:center;}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:50px 24px;text-align:center;color:var(--soft);}
.empty h3{font-size:20px;font-weight:700;color:var(--ink);margin:0 0 6px;}
.empty p{margin:0 0 16px;}
/* FORM */
.form-layout{display:flex;gap:20px;align-items:flex-start;}
.tabs{width:190px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;position:sticky;top:76px;}
.tab{text-align:left;background:transparent;border:none;border-radius:7px;padding:10px 12px;display:flex;align-items:center;gap:8px;color:var(--soft);font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;}
.tab .tn{font-family:var(--fm);font-size:11px;color:var(--soft);}
.tab:hover{background:rgba(32,38,42,.05);color:var(--ink);}
.tab.active{background:var(--gr);color:#fff;}
.tab.active .tn{color:var(--amber);}
.panel-wrap{flex:1;min-width:0;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:24px 26px;}
.panel{display:none;}
.panel.active{display:block;animation:fi .16s ease;}
@keyframes fi{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
.stitle{font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 16px;}
.ssub{color:var(--soft);font-size:13px;margin:-8px 0 14px;}
.tear{display:flex;align-items:center;gap:10px;margin:22px 0 13px;color:var(--soft);font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;}
.tear::before,.tear::after{content:'';flex:1;border-top:2px dashed var(--line);}
/* FIELDS */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:13px 15px;}
.f{display:flex;flex-direction:column;gap:5px;}
.f.full{grid-column:1/-1;}
.f label{font-size:12px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.03em;}
.f input,.f select,.f textarea{border:1.5px solid var(--line);border-radius:7px;padding:9px 11px;background:#fff;width:100%;}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--amber2);outline:none;}
.f textarea{resize:vertical;min-height:80px;line-height:1.5;}
.dur-pill{font-family:var(--fm);font-size:13px;background:#fff;border:1.5px solid var(--line);border-radius:7px;padding:9px 11px;color:var(--soft);display:inline-block;}
.rrow{display:flex;gap:16px;flex-wrap:wrap;margin:4px 0;}
.rrow label{display:flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer;}
.rrow input{accent-color:var(--amber2);width:16px;height:16px;}
/* CHECKLIST */

/* ===== UTILITAIRES ===== */
function q(s,r){return(r||document).querySelector(s)}
function qa(s,r){return Array.from((r||document).querySelectorAll(s))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){if(s==null)return'';var m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return String(s).replace(/[&<>"']/g,function(c){return m[c];})}
function today(){var d=new Date(),t=d.getTimezoneOffset()*60000;return new Date(d-t).toISOString().slice(0,10)}
function fmtDate(iso){if(!iso)return'';var p=iso.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso}
function fmtRange(r){if(!r||!r.dateDebut)return'';if(!r.dateFin||r.dateFin===r.dateDebut)return fmtDate(r.dateDebut);return 'du '+fmtDate(r.dateDebut)+' au '+fmtDate(r.dateFin)}
function durée(r){
  if(r.baseTemps==='devis')return'Suivant devis';
  if(r.baseTemps==='contrat')return'Suivant contrat';
  if(!r.dateDebut||!r.dateFin||!r.heureDebut||!r.heureFin)return'';
  var s=new Date(r.dateDebut+'T'+r.heureDebut),e=new Date(r.dateFin+'T'+r.heureFin);
  var dm=Math.round((e-s)/60000);if(isNaN(dm)||dm<0)return'';
  var j=Math.floor(dm/1440),h=Math.floor((dm%1440)/60),m=dm%60;
  return(j?j+'j ':'')+( h?h+'h ':'')+( m?m+'min':'');
}
function deepSet(obj,path,val){
  var p=path.split('.');var c=obj;
  for(var i=0;i<p.length-1;i++){if(c[p[i]]==null)c[p[i]]={};c=c[p[i]];}
  c[p[p.length-1]]=val;
}

/* ===== STOCKAGE ===== */
/* Stockage persistant.
   1er choix : window.storage (environnement Claude)
   2e choix  : localStorage du navigateur — indispensable hors de Claude,
               sans quoi les données seraient perdues à chaque fermeture. */
var HS = (typeof window.storage !== 'undefined');
var LS = (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();
var MEM = {};
var PFX = 'regulair:';

async function sGet(k){
  if(HS){ try{ var r=await window.storage.get(k,false); return r?JSON.parse(r.value):null; }catch(e){} }
  if(LS){ try{ var v=localStorage.getItem(PFX+k); return v?JSON.parse(v):null; }catch(e){} }
  return (k in MEM) ? MEM[k] : null;
}
async function sSet(k,v){
  var ok=false;
  if(HS){ try{ await window.storage.set(k,JSON.stringify(v),false); ok=true; }catch(e){} }
  if(LS){
    try{ localStorage.setItem(PFX+k, JSON.stringify(v)); ok=true; }
    catch(e){
      /* Quota dépassé : prévenir plutôt que perdre des données en silence */
      if(e && (e.name==='QuotaExceededError' || e.code===22)){
        try{ toast(false,'M\u00e9moire du navigateur pleine. Exportez une sauvegarde puis supprimez d\u2019anciens rapports.'); }catch(_){}
      }
    }
  }
  MEM[k]=v;
  return ok || true;
}
async function sDel(k){
  if(HS){ try{ await window.storage.delete(k,false); }catch(e){} }
  if(LS){ try{ localStorage.removeItem(PFX+k); }catch(e){} }
  delete MEM[k];
  return true;
}

function calcCO2(denom,chargeTot){
  if(!denom||!chargeTot)return'';
  function norm(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,'');}
  var key=norm(denom.trim());
  var gwp=0;
  Object.keys(GWP).forEach(function(k){
    var nk=norm(k);
    if(key===nk||'R'+key===nk||key==='R'+nk)gwp=GWP[k];
  });
  if(!gwp)return'';

  if(isNaN(kg)||kg<=0)return'';
  return String(Math.round(kg*gwp/10)/100);

/* ===== COMPRESSION IMAGE ===== */
function compressImg(file,maxD,qual){
  maxD=maxD||1400;qual=qual||0.75;
  return new Promise(function(res,rej){
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight;
        if(w>maxD||h>maxD){if(w>=h){h=Math.round(h*maxD/w);w=maxD;}else{w=Math.round(w*maxD/h);h=maxD;}}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        res({dataUrl:cv.toDataURL('image/jpeg',qual),w:w,h:h});
      };
      img.onerror=function(){rej(new Error('illisible'));};
      img.src=rd.result;
    };
    rd.onerror=function(){rej(new Error('lecture'));};
    rd.readAsDataURL(file);
  });
}






/* ═══════════ AUTOCOMPLÉTION DU CHAMP SITE ═══════════ */
function bindSiteAuto(){
  var inp=q('#site-input'), box=q('#site-sugg');
  if(!inp||!box) return;
  var sel=-1, shown=[];

  function hide(){ box.innerHTML=''; box.className=''; sel=-1; shown=[]; }

  function show(){
    var t=inp.value.trim().toLowerCase();
    if(t.length<1 || !CLIENTS.length){ hide(); return; }
    shown=CLIENTS.filter(function(c){
      return [c.nom,c.ville,c.adresse].some(function(v){ return (v||'').toLowerCase().includes(t); });
    }).slice(0,8);
    if(!shown.length){ hide(); return; }
    box.className='site-sugg';
    box.innerHTML=shown.map(function(c,i){
      var adr=[c.adresse,[c.cp,c.ville].filter(Boolean).join(' ')].filter(Boolean).join(', ');
      return '<div data-si="'+i+'"'+(i===sel?' class="sel"':'')+'>'+
        '<div class="ss-nom">'+esc(c.nom||'')+'</div>'+
        (adr?'<div class="ss-adr">'+esc(adr)+'</div>':'')+
        ((c.equip||[]).length?'<div class="ss-adr">'+c.equip.length+' \u00e9quipement(s)</div>':'')+
      '</div>';
    }).join('');
    qa('#site-sugg div[data-si]').forEach(function(d){
      d.onclick=function(){ pickClient(shown[parseInt(d.dataset.si,10)]); };
    });
  }

  inp.addEventListener('input', show);
  inp.addEventListener('focus', show);
  inp.addEventListener('blur', function(){ setTimeout(hide,180); });
  inp.addEventListener('keydown', function(e){
    if(!shown.length) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,shown.length-1); show(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); show(); }
    else if(e.key==='Enter' && sel>=0){ e.preventDefault(); pickClient(shown[sel]); }
    else if(e.key==='Escape'){ hide(); }
  });

  function pickClient(c){
    if(!c) return;
    var adr=adrClient(c);
    inp.value=adr;
    deepSet(ST.cur,'site',adr);
    ST.cur.clientId=c.id;
    var ft=q('#form-title'); if(ft) ft.textContent=adr;
    /* CERFA : détenteur = client */
    migreCerfas(ST.cur);
    var Pc='cerfas.'+ST.cur.cerfaIdx+'.';
    var dtxt=detenteurTxt(c);
    deepSet(ST.cur,Pc+'det',dtxt);
    var ed=q('[data-f="'+Pc+'det"]'); if(ed) ed.value=dtxt;
    /* Destinataire du mail = e-mail du client */
    if(c.email) ST.cur.clientEmail=c.email;
    /* Nom du client seul (colonne Nom du fichier) — sans adresse ni contact */
    var nomCli = c.nom || '';
    if(nomCli){
      if(!ST.cur.nomClient){
        ST.cur.nomClient = nomCli;
        var en=q('[data-f="nomClient"]'); if(en) en.value=nomCli;
      }
      var cc=cerfaCur();
      if(cc && !cc.detNom){
        deepSet(ST.cur,Pc+'detNom',nomCli);
        var edn=q('[data-f="'+Pc+'detNom"]'); if(edn) edn.value=nomCli;
      }
    }
    hide();
    /* Un seul équipement : le pousser directement dans le CERFA */
    var eqs=c.equip||[];
    if(eqs.length===1) applyEquip(eqs[0]);
    else if(eqs.length>1) choisirEquip(c);
    else toast(true,'Client s\u00e9lectionn\u00e9.');
  }
}

/* Renseigne le CERFA à partir d'un équipement */
function applyEquip(e){
  if(!e) return;
  migreCerfas(ST.cur);
  var P='cerfas.'+ST.cur.cerfaIdx+'.';
  var ident=[e.designation,e.marque,e.modele,e.serie?'N\u00b0 '+e.serie:''].filter(Boolean).join(' ');
  if(ident){
    deepSet(ST.cur,P+'equipIdent',ident);
    var ei=q('[data-f="'+P+'equipIdent"]'); if(ei) ei.value=ident;
  }
  if(e.fluide){
    deepSet(ST.cur,P+'fluideDenom',e.fluide);
    var ef=q('[data-f="'+P+'fluideDenom"]'); if(ef) ef.value=e.fluide;
  }
  if(e.charge){
    deepSet(ST.cur,P+'chargeTot',e.charge);
    var ec=q('[data-f="'+P+'chargeTot"]'); if(ec) ec.value=e.charge;
  }
  var co2=calcCO2(e.fluide,e.charge);
  if(co2){
    deepSet(ST.cur,P+'tonnCO2',co2);
    var et=q('[data-f="'+P+'tonnCO2"]'); if(et) et.value=co2;
  }
  toast(true,'\u00c9quipement report\u00e9 dans la fiche fluides.');
}

/* ─────────── IMPORT CSV ─────────── */
function parseCSV(txt){
  /* Détection du séparateur */
  var first=txt.split(/\r?\n/)[0]||'';
  var sep = (first.split(';').length > first.split(',').length) ? ';' : ',';
  var rows=[], cur=[], val='', inQ=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt[i];
    if(inQ){
      if(ch==='"'){ if(txt[i+1]==='"'){ val+='"'; i++; } else inQ=false; }
      else val+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===sep){ cur.push(val); val=''; }
      else if(ch==='\n'){ cur.push(val); rows.push(cur); cur=[]; val=''; }
      else if(ch!=='\r') val+=ch;
    }
  }
  if(val||cur.length){ cur.push(val); rows.push(cur); }
  return rows.filter(function(r){ return r.some(function(c){ return (c||'').trim(); }); });
}

/* Devine la colonne correspondant à un champ */
function guessCol(headers, keys){
  for(var i=0;i<headers.length;i++){
    var h=(headers[i]||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    for(var k=0;k<keys.length;k++){
      if(h.indexOf(keys[k])>=0) return i;
    }
  }
  return -1;
}

function importClientsCSV(){
  var inp=q('#csv-input');
  inp.value='';
  inp.onchange=function(e){
    var f=e.target.files&&e.target.files[0];
    if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var rows;
      try{ rows=parseCSV(rd.result); }
      catch(err){ toast(false,'Fichier illisible.'); return; }
      if(rows.length<2){ toast(false,'Fichier vide ou sans donn\u00e9es.'); return; }
      mapCSV(rows);
    };
    rd.onerror=function(){ toast(false,'Lecture impossible.'); };
    rd.readAsText(f,'UTF-8');
  };
  inp.click();
}

function mapCSV(rows){
  var headers=rows[0].map(function(h){return (h||'').trim();});
  var data=rows.slice(1);
  var fields=[
    {k:'nom',     l:'Nom / raison sociale', keys:['nom','client','raison','societe','société','entreprise'], req:true},
    {k:'adresse', l:'Adresse',              keys:['adresse','rue','voie','adr']},
    {k:'cp',      l:'Code postal',          keys:['cp','codepostal','postal','zip']},
    {k:'ville',   l:'Ville',                keys:['ville','commune','city']},
    {k:'contact', l:'Contact',              keys:['contact','interlocuteur','responsable']},
    {k:'tel',     l:'T\u00e9l\u00e9phone',  keys:['tel','phone','portable','mobile','telephone']},
    {k:'email',   l:'E-mail',               keys:['mail','email','courriel']},
    {k:'notes',   l:'Notes',                keys:['note','commentaire','remarque','info']}
  ];
  var opts=function(sel){

      '<div class="mact">'+
        '<button class="btn ghost" id="csv-cancel">Annuler</button>'+
        '<button class="btn amber" id="csv-go">'+icon('check',14)+' Importer</button>'+
      '</div>'+
    '</div></div>';
  q('#mbg').onclick=function(e){ if(e.target.id==='mbg') closeModal(); };
  q('#csv-cancel').onclick=closeModal;
  q('#csv-go').onclick=async function(){
    var map={};
    qa('[data-map]').forEach(function(s){ map[s.dataset.map]=parseInt(s.value,10); });
    if(map.nom<0){ toast(false,'La colonne « Nom » est obligatoire.'); return; }
    var replace=q('#csv-replace').checked;
    if(replace) CLIENTS=[];
    var existing={}; CLIENTS.forEach(function(c){ existing[(c.nom||'').toLowerCase()]=true; });
    var added=0, skipped=0;
    data.forEach(function(row){
      var nom=(row[map.nom]||'').trim();
      if(!nom){ skipped++; return; }
      if(existing[nom.toLowerCase()]){ skipped++; return; }
      var c=defClient();
      c.nom=nom;
      ['adresse','cp','ville','contact','tel','email','notes'].forEach(function(k){
        if(map[k]>=0) c[k]=(row[map[k]]||'').trim();
      });
      CLIENTS.push(c); existing[nom.toLowerCase()]=true; added++;
    });
    await saveClients();
    closeModal(); renderClientList();
    toast(true, added+' client(s) import\u00e9(s)'+(skipped?', '+skipped+' ignor\u00e9(s)':'')+'.');
  };
}

/* Détenteur CERFA : nom + adresse complète */

/* ═══════════ FICHES CERFA MULTIPLES ═══════════ */
/* Ancien format (une seule fiche) -> nouveau format (tableau) */
function migreCerfas(r){
  if(!r) return r;
  if(!Array.isArray(r.cerfas)){
    r.cerfas = r.cerfa ? [r.cerfa] : [defCerfa()];
    delete r.cerfa;
  }
  if(!r.cerfas.length) r.cerfas=[defCerfa()];
  if(typeof r.cerfaIdx!=='number' || r.cerfaIdx>=r.cerfas.length) r.cerfaIdx=0;
  return r;
}
/* Fiche CERFA actuellement affichée */
function cerfaCur(){
  migreCerfas(ST.cur);
  return ST.cur.cerfas[ST.cur.cerfaIdx];
}
/* Fiches à imprimer */
function cerfasActives(r){
  migreCerfas(r);
  return r.cerfas.filter(function(c){ return c && c.active; });
}
function ajouterCerfa(){
  migreCerfas(ST.cur);
  var n=defCerfa();
  n.active=true;
  /* Reprendre les informations communes de la première fiche */
  var p=ST.cur.cerfas[0];
  if(p){
    n.op=p.op; n.det=p.det; n.attest=p.attest;
    n.opNom=p.opNom; n.opQual=p.opQual; n.opDate=p.opDate;
    n.detNom=p.detNom; n.detQual=p.detQual; n.detDate=p.detDate;
    n.detectIdent=p.detectIdent; n.detectDate=p.detectDate;
  }
  ST.cur.cerfas.push(n);
  ST.cur.cerfaIdx=ST.cur.cerfas.length-1;
  rerenderCerfa();
  toast(true,'Fiche '+ST.cur.cerfas.length+' ajout\u00e9e.');
}
function supprimerCerfa(i){
  migreCerfas(ST.cur);
  if(ST.cur.cerfas.length<=1){ toast(false,'Au moins une fiche est n\u00e9cessaire.'); return; }
  doConfirm('Supprimer la fiche ?','La fiche fluides n\u00b0'+(i+1)+' sera supprim\u00e9e.','Supprimer',function(){
    ST.cur.cerfas.splice(i,1);
    if(ST.cur.cerfaIdx>=ST.cur.cerfas.length) ST.cur.cerfaIdx=ST.cur.cerfas.length-1;
    rerenderCerfa();
    toast(true,'Fiche supprim\u00e9e.');
  },true);
}
function allerCerfa(i){
  migreCerfas(ST.cur);
  if(i<0||i>=ST.cur.cerfas.length) return;
  ST.cur.cerfaIdx=i;
  rerenderCerfa();
}

/* Construit un lien mailto compatible Windows/Outlook.
   Windows rejette silencieusement les liens au-delà d'environ 2000 caractères ;
   l'encodage des accents et des sauts de ligne triple la taille du texte,
   on raccourcit donc le corps jusqu'à repasser sous la limite. */
function buildMailto(dest, sujet, corps){
  var LIMITE = 1900;
  function url(c){
    return 'mailto:'+dest+'?subject='+encodeURIComponent(sujet)+'&body='+encodeURIComponent(c);
  }
  var u = url(corps);
  if(u.length <= LIMITE) return u;
  /* Réduction progressive */
  var txt = corps;
  while(txt.length > 80 && url(txt+'\n\n[...] Detail complet dans le PDF joint.').length > LIMITE){
    txt = txt.slice(0, Math.floor(txt.length*0.8));
  }
  return url(txt+'\n\n[...] Detail complet dans le PDF joint.');
}

/* Version courte du corps, sans accents, pour les liens mailto */
function corpsCourt(r){
  var t = (isSuite(r) ? 'SUITE A DONNER' : 'Rapport d intervention') + '\n\n';
  t += 'Reference : '+(r.ref||'')+'\n';
  if(r.site)        t += 'Site : '+r.site+'\n';
  if(r.dateDebut)   t += 'Date : '+fmtRange(r)+'\n';
  if(r.intervenant) t += 'Technicien : '+r.intervenant+'\n';
  t += 'Statut : '+(r.statut||'')+'\n';
  var d=(r.descriptif||'').trim();
  if(d) t += '\nTravaux :\n'+(d.length>400 ? d.slice(0,400)+'...' : d)+'\n';
  t += '\nRapport complet en piece jointe.\n\n'+(r.intervenant||ST.cfg.tech||CO_NAME);
  return t;
}

/* ═══════════ SUIVI DES INTERVENTIONS « SUITE À DONNER » ═══════════ */
function isSuite(r){ return (r.statut||'').indexOf('Suite')===0; }
/* Retrouve le client d'un rapport : par identifiant, sinon par nom dans le champ Site */
function clientDuRapport(r){
  if(!r) return null;
  if(r.clientId){
    var c=CLIENTS.find(function(x){return x.id===r.clientId;});
    if(c) return c;
  }
  var s=(r.site||'').toLowerCase();
  if(!s) return null;
  /* Correspondance sur le nom du client contenu dans le champ Site */
  var best=null;
  CLIENTS.forEach(function(c){
    var n=(c.nom||'').toLowerCase();
    if(n && s.indexOf(n)>=0){
      if(!best || n.length>(best.nom||'').length) best=c;
    }
  });
  return best;
}

function destSuivi(r){
  var out=[];
  /* 1 - e-mail du client */
  var c=clientDuRapport(r);
  if(c&&c.email) out.push(c.email.trim());
  else if(r.clientEmail) out.push(String(r.clientEmail).trim());
  /* 2 - adresse interne, toujours en copie */
  var interne=(ST.cfg.suiviMail||CO_MAIL||'').trim();
  if(interne) interne.split(/[;,\s]+/).forEach(function(a){ if(a) out.push(a); });
  /* 3 - adresse dédiée « Suite à donner » */
  var s=(ST.cfg.suiteMail||'').trim();
  if(isSuite(r)&&s) s.split(/[;,\s]+/).forEach(function(a){ if(a) out.push(a); });
  /* Dédoublonnage en conservant l'ordre */
  var vus={},res=[];
  out.forEach(function(a){ var k=a.toLowerCase(); if(a&&!vus[k]){vus[k]=1;res.push(a);} });
  return res.join(', ');
}

/* Compose le corps du mail de suivi */
function corpsSuivi(r){
  var t = isSuite(r) ? 'INTERVENTION AVEC SUITE \u00c0 DONNER\n\n'
                     : 'RAPPORT D\u2019INTERVENTION\n\n';
  t+='R\u00e9f\u00e9rence : '+(r.ref||'')+'\n';
  if(r.site)        t+='Site : '+r.site+'\n';
  if(r.dateDebut)   t+='Date : '+fmtRange(r)+'\n';
  if(r.intervenant) t+='Technicien : '+r.intervenant+'\n';
  if(r.typesI&&r.typesI.length) t+='Type : '+r.typesI.join(', ')+'\n';
  t+='Statut : '+(r.statut||'')+'\n';
  t+='\n--- Travaux r\u00e9alis\u00e9s ---\n'+((r.descriptif||'').trim()||'(non renseign\u00e9)')+'\n';
  if(r.fournitures&&r.fournitures.trim()) t+='\n--- Fournitures ---\n'+r.fournitures.trim()+'\n';
  if(r.obsClient&&r.obsClient.trim())     t+='\n--- Observations client ---\n'+r.obsClient.trim()+'\n';
  t+='\nLe rapport complet est joint.\n\n'+(r.intervenant||ST.cfg.tech||CO_NAME);
  return t;
}

/* Envoi (partage natif si dispo, sinon téléchargement + client mail) */
async function envoyerSuivi(r, blob, fname, destOverride){
  var brut = (destOverride!==undefined && destOverride!==null) ? String(destOverride) : destSuivi(r);
  var liste = brut.split(/[;,\s]+/).map(function(s){return s.trim();}).filter(Boolean);
  var dest  = liste.join(',');
  var suj   = (isSuite(r)?'SUITE \u00c0 DONNER \u2014 ':'Rapport d\u2019intervention \u2014 ')+(r.ref||'')+(r.site?' \u2014 '+r.site:'');
  var corps = corpsSuivi(r);                    /* version complète : Gmail, Outlook web, mobile */
  var mlink = buildMailto(dest, suj, corpsCourt(r));  /* version courte : application installée */

  async function marquerEnvoye(){
    r.mailEnvoye=true; r.mailDate=new Date().toISOString(); r.mailDest=dest;
    if(ST.cur && ST.cur.id===r.id){
      ST.cur.mailEnvoye=true; ST.cur.mailDate=r.mailDate; ST.cur.mailDest=dest;
    }
    try{ await sSet('r:'+r.id,r); }catch(e){}
    var ix=ST.idx.findIndex(function(x){return x.id===r.id;});
    if(ix>=0){ ST.idx[ix].mailEnvoye=true; try{ await sSet('idx',ST.idx); }catch(e){} }
    if(q('#dossier-box')) refreshDossier();
  }

  /* ── Mobile : partage natif, PDF joint automatiquement ── */
  try{
    var file=new File([blob],fname,{type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({title:suj, text:corps, files:[file]});
      await marquerEnvoye();
      toast(true,'Rapport transmis.');
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }

  /* ── Ordinateur ── */
  var url=URL.createObjectURL(blob);
  var gmail='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(dest)+
            '&su='+encodeURIComponent(suj)+'&body='+encodeURIComponent(corps);
  var outlook='https://outlook.office.com/mail/deeplink/compose?to='+encodeURIComponent(dest)+
            '&subject='+encodeURIComponent(suj)+'&body='+encodeURIComponent(corps);
  closeModal();
  q('#modal').innerHTML=
    '<div class="mbg" id="mbg"><div class="mbox sm">'+
      '<h3>Envoi du rapport</h3>'+
      '<div class="env-dest"><span>\u00c0</span><code>'+esc(dest||'\u2014')+'</code>'+
        '<button class="btn ghost sm" id="cp-dest">Copier</button></div>'+
      '<a class="btn amber" style="justify-content:center;width:100%;margin-bottom:12px;" href="'+url+'" download="'+esc(fname)+'">'+icon('save',14)+' 1. T\u00e9l\u00e9charger le PDF</a>'+
      '<p class="cfg-hint" style="margin-bottom:8px;">2. Ouvrir la messagerie :</p>'+
      '<div class="env-apps">'+
        '<a class="env-app" href="'+esc(mlink)+'">'+icon('mail',15)+' Application par d\u00e9faut</a>'+
        '<a class="env-app" href="'+esc(gmail)+'" target="_blank" rel="noopener">Gmail</a>'+
        '<a class="env-app" href="'+esc(outlook)+'" target="_blank" rel="noopener">Outlook web</a>'+
      '</div>'+
      '<p class="cfg-hint">3. Glissez le PDF t\u00e9l\u00e9charg\u00e9 dans le message.</p>'+
      '<div class="mact">'+
        '<button class="btn ghost" id="env-annuler">Fermer</button>'+
        '<button class="btn amber" id="env-ok">'+icon('check',14)+' Message envoy\u00e9</button>'+
      '</div>'+
    '</div></div>';

  function cleanup(){ try{URL.revokeObjectURL(url);}catch(e){} closeModal(); }
  q('#mbg').onclick=function(e){ if(e.target.id==='mbg') cleanup(); };
  q('#env-annuler').onclick=cleanup;
  q('#env-ok').onclick=async function(){ cleanup(); await marquerEnvoye(); toast(true,'Rapport marqu\u00e9 comme envoy\u00e9.'); };
  q('#cp-dest').onclick=function(){
    try{
      navigator.clipboard.writeText(dest);
      toast(true,'Adresse copi\u00e9e.');
    }catch(e){ toast(false,'Copie impossible.'); }
  };
}

/* ═══════════ SAUVEGARDE & RESTAURATION ═══════════ */
async function exportData(){
  try{
    toast(true,'Pr\u00e9paration de la sauvegarde\u2026');
    var reports=[];
    for(var i=0;i<ST.idx.length;i++){
      var r=await sGet('r:'+ST.idx[i].id);
      if(r) reports.push(r);
    }
    var ctr=await sGet('ctr');
    var payload={
      format:'regulair-backup',
      version:1,
      exportedAt:new Date().toISOString(),
      count:reports.length,
      cfg:ST.cfg,
      counter:ctr||{v:0},
      index:ST.idx,
      clients:CLIENTS,
      reports:reports
    };
    var texte=JSON.stringify(payload,null,1);
    var d=new Date();
    var stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    var nom='REGULAIR-sauvegarde-'+stamp+'.json';
    var blob=new Blob([texte],{type:'application/json'});

    /* Sur mobile : partage natif (AirDrop, OneDrive, Mail…) */
    try{
      var file=new File([blob],nom,{type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({title:nom, files:[file]});
        toast(true,reports.length+' rapport(s) et '+CLIENTS.length+' client(s) sauvegard\u00e9s.');
        return;
      }
    }catch(e){ if(e && e.name==='AbortError') return; }

    /* Sinon : téléchargement classique */
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=nom; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(url);document.body.removeChild(a);},500);
    toast(true,reports.length+' rapport(s) et '+CLIENTS.length+' client(s) sauvegard\u00e9s.');
  }catch(e){
    console.error(e);
    toast(false,'\u00c9chec de la sauvegarde.');
  }
}

/* Vérifie puis propose la restauration */
function verifBackup(data){
  if(!data||data.format!=='regulair-backup'||!Array.isArray(data.reports)){
    toast(false,'Ce fichier n\u2019est pas une sauvegarde REGUL\u2019AIR.');
    return;
  }
  var n=data.reports.length;
  var nc=(data.clients||[]).length;
  var dt=data.exportedAt?fmtDate(data.exportedAt.slice(0,10)):'date inconnue';
  doConfirm(
    'Restaurer la sauvegarde ?',
    n+' rapport(s) et '+nc+' client(s) du '+dt+'. Les \u00e9l\u00e9ments existants sont mis \u00e0 jour, les autres conserv\u00e9s.',
    'Restaurer',
    function(){ applyBackup(data); }
  );
}

function readBackup(file){
  var rd=new FileReader();
  rd.onload=function(){
    var data;
    try{ data=JSON.parse(rd.result); }
    catch(e){ toast(false,'Fichier illisible.'); return; }
    verifBackup(data);
  };
  rd.onerror=function(){ toast(false,'Lecture impossible.'); };
  rd.readAsText(file);
}

async function applyBackup(data){
  try{
    toast(true,'Restauration en cours\u2026');
    var added=0,replaced=0;
    for(var i=0;i<data.reports.length;i++){
      var r=data.reports[i];
      if(!r||!r.id) continue;
      if(!r.cerfa) r.cerfa=defCerfa();
      var exists=ST.idx.some(function(x){return x.id===r.id;});
      await sSet('r:'+r.id,r);
      var entry={id:r.id,ref:r.ref,site:r.site||'',statut:r.statut,
                 dateDebut:r.dateDebut,dateFin:r.dateFin,upd:r.updatedAt||Date.now(),
                 dossier:r.dossier||'attente',mailEnvoye:!!r.mailEnvoye};
      var ix=ST.idx.findIndex(function(x){return x.id===r.id;});
      if(ix>=0){ ST.idx[ix]=entry; replaced++; }
      else { ST.idx.push(entry); added++; }
    }
    await sSet('idx',ST.idx);
    /* Compteur : garder le plus grand */
    if(data.counter&&typeof data.counter.v==='number'){
      var cur=(await sGet('ctr'))||{v:0};
      if(data.counter.v>(cur.v||0)) await sSet('ctr',{v:data.counter.v});
    }
    /* Clients : fusion par nom */
    if(Array.isArray(data.clients)&&data.clients.length){
      var byName={}; CLIENTS.forEach(function(c){ byName[(c.nom||'').toLowerCase()]=c; });
      var cAdd=0;
      data.clients.forEach(function(c){
        if(!c||!c.nom) return;
        var k=c.nom.toLowerCase();
        if(byName[k]){
          /* compléter les équipements manquants */
          var ex=byName[k];
          (c.equip||[]).forEach(function(e){
            var dup=(ex.equip||[]).some(function(x){
              return (x.serie&&x.serie===e.serie)||(x.designation===e.designation&&x.marque===e.marque);
            });
            if(!dup){ ex.equip=ex.equip||[]; ex.equip.push(e); }
          });
        } else { CLIENTS.push(c); byName[k]=c; cAdd++; }
      });
      await saveClients();
    }
    /* Réglages : seulement si vides localement */
    if(data.cfg){
      if(!ST.cfg.tech&&data.cfg.tech) ST.cfg.tech=data.cfg.tech;
      if(data.cfg.footer) ST.cfg.footer=data.cfg.footer;
      await sSet('cfg',ST.cfg);
    }
    closeModal();
    renderList();
    toast(true,added+' ajout\u00e9(s), '+replaced+' mis \u00e0 jour.');
  }catch(e){
    console.error(e);
    toast(false,'\u00c9chec de la restauration.');
  }
}

/* ═══════════ BIBLIOTHÈQUE PDF — chargement + cache hors-ligne ═══════════ */
var JSPDF_CDN='https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.3/jspdf.umd.min.js';
var LIB_KEY='jspdf-lib-3.0.3';
var libState='idle';   /* idle | loading | ready | failed */

/* Stockage de secours : localStorage si window.storage indisponible */
function libGet(){
  try{ var v=localStorage.getItem(LIB_KEY); if(v) return v; }catch(e){}
  return null;
}
function libPut(txt){
  try{ localStorage.setItem(LIB_KEY,txt); return true; }catch(e){ return false; }
}

function injectLib(code){
  try{
    var s=document.createElement('script');
    s.textContent=code;
    document.head.appendChild(s);
    return !!window.jspdf;
  }catch(e){ return false; }
}

async function ensureLib(){
  if(window.jspdf){ libState='ready'; return true; }
  if(libState==='loading') return false;
  libState='loading';

  /* 1 ─ Cache local (fonctionne hors-ligne) */
  var cached=libGet();
  if(cached && injectLib(cached)){
    libState='ready';
    return true;
  }

  /* 2 ─ Téléchargement depuis le CDN, puis mise en cache */
  try{
    var resp=await fetch(JSPDF_CDN,{cache:'force-cache'});
    if(resp.ok){
      var txt=await resp.text();
      if(injectLib(txt)){
        libPut(txt);
        libState='ready';
        return true;
      }
    }
  }catch(e){}

  /* 3 ─ Dernier recours : balise <script src> classique */
  try{
    await new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src=JSPDF_CDN;
      s.onload=res; s.onerror=rej;
      document.head.appendChild(s);
      setTimeout(rej,8000);
    });
    if(window.jspdf){
      libState='ready';
      /* tenter de mettre en cache pour la prochaine fois */
      try{ var r2=await fetch(JSPDF_CDN); if(r2.ok) libPut(await r2.text()); }catch(e){}
      return true;
    }
  }catch(e){}

  libState='failed';
  return false;
}

/* Indicateur visuel de disponibilité hors-ligne */
function libBadge(){
  var ready = !!libGet();
  return '<span class="lib-badge '+(ready?'ok':'no')+'" title="'+
    (ready?'PDF disponible hors-ligne':'Connectez-vous une fois pour activer le mode hors-ligne')+
    '">'+(ready?'\u25cf Hors-ligne pr\u00eat':'\u25cb Hors-ligne inactif')+'</span>';
}

          '<button class="btn ghost" id="b-mail">'+icon('mail',15)+' Email</button>'+
          '<button class="btn amber" id="b-pdf">'+icon('pdf',15)+' G\u00e9n\u00e9rer PDF</button>'+
        '</div>'+
      '</div>'+
    '</div>';

  q('#b-back').onclick=async function(){var ok=await save(false);ST.view='list';renderApp();if(ok)toast(true,'Sauvegard\u00e9.');};
  q('#b-save').onclick=function(){save(true);};
  q('#b-pdf').onclick=handlePdf;
  var bm=q('#b-mail');if(bm)bm.onclick=function(){mailRapport(ST.cur.id,ST.cur);};

  q('#tabs').onclick=function(e){var b=e.target.closest('.tab');if(b)goTab(b.dataset.tab);};

  /* délégation input */
  q('#pw').addEventListener('input',function(e){
    var f=e.target.dataset.f;
    if(!f)return;
    deepSet(ST.cur,f,e.target.value);
    if(['heureDebut','heureFin','dateDebut','dateFin'].includes(f))refreshDur();
    /* Auto-remplir "Date au" avec "Date du" si elles sont identiques ou vide */
    if(f==='dateDebut'){
      var au=q('[data-f="dateFin"]');
      if(au&&(!au.value||au.value===ST.cur.dateFin)){
        au.value=e.target.value;deepSet(ST.cur,'dateFin',e.target.value);
      }
    }
    if(f==='site'){
      q('#form-title').textContent=ST.cur.site||'Nouveau rapport';
      /* CERFA: détenteur = nom + adresse du client */
      var cD=clientDuRapport(ST.cur);
      var dv=cD?detenteurTxt(cD):e.target.value;
      migreCerfas(ST.cur);
      var Ps='cerfas.'+ST.cur.cerfaIdx+'.';
      deepSet(ST.cur,Ps+'det',dv);
      var elDet=q('[data-f="'+Ps+'det"]'); if(elDet) elDet.value=dv;
    }
    /* Nom client (signatures) -> nom signataire détenteur du CERFA */
    if(f==='nomClient'){
      var cc2=cerfaCur();
      if(cc2 && !cc2.detNom){
        var Pn='cerfas.'+ST.cur.cerfaIdx+'.';
        deepSet(ST.cur,Pn+'detNom',e.target.value);
        var edn2=q('[data-f="'+Pn+'detNom"]'); if(edn2) edn2.value=e.target.value;
      }
    }
    /* CERFA: recopier la date opérateur vers détenteur */
    if(/^cerfas\.\d+\.opDate$/.test(f)){
      var Pd=f.replace(/opDate$/,'');
      deepSet(ST.cur,Pd+'detDate',e.target.value);
      var elDD=q('[data-f="'+Pd+'detDate"]'); if(elDD) elDD.value=e.target.value;
    }
    /* CERFA: calcul auto du tonnage CO2 */
    if(/^cerfas\.\d+\.(fluideDenom|chargeTot)$/.test(f)){
      var Pf=f.replace(/(fluideDenom|chargeTot)$/,'');
      var cfN=parseInt(f.split('.')[1],10);
      var cfO=ST.cur.cerfas[cfN];
      if(cfO){
        var co2=calcCO2(cfO.fluideDenom,cfO.chargeTot);
        if(co2){
          deepSet(ST.cur,Pf+'tonnCO2',co2);
          var elC=q('[data-f="'+Pf+'tonnCO2"]'); if(elC) elC.value=co2;
        }
      }
    }
  });

  /* délégation change */
  q('#pw').addEventListener('change',function(e){
    var t=e.target;
    if(t.dataset.itype!==undefined){
      /* Un seul type d'intervention à la fois */
      ST.cur.typesI = t.checked ? [t.dataset.itype] : [];
    } else if(t.dataset.chk){
      deepSet(ST.cur,t.dataset.chk,t.checked);
      if(/^cerfas\.\d+\.active$/.test(t.dataset.chk)){
        var bd=q('#cerfa-body'); if(bd) bd.style.display=t.checked?'block':'none';
        if(t.checked) setTimeout(initSigCerfa,60);
      }
    } else if(t.dataset.radio){
      deepSet(ST.cur,t.dataset.radio,t.value);
    } else if(t.name==='btemps'){
      ST.cur.baseTemps=t.value;refreshDur();
    }
  });

  bindPhotos();
  bindClr();
  bindSiteAuto();
  bindDossier();
  bindCerfaUI();
}

function goTab(k){
  ST.tab=k;
  qa('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===k);});
  qa('.panel').forEach(function(p){p.classList.toggle('active',p.dataset.tab===k);});
  /* init pads après rendu */
  if(k==='sig'){
    setTimeout(function(){
      initSig('sig-tech','sigTech',ST.cur.sigTech);
      initSig('sig-client','sigClient',ST.cur.sigClient);
      bindClr();
    },60);
  }
  if(k==='cerfa'){
    setTimeout(initSigCerfa,60);
  }
}

function bindPhotos(){
  var dz=q('#dropz'),pi=q('#photo-input');
  if(!dz||!pi)return;
  dz.onclick=function(){pi.click();};
  pi.onchange=function(e){doPhotos(e.target.files);pi.value='';};
  ['dragover','dragleave','drop'].forEach(function(ev){
    dz.addEventListener(ev,function(e){
      e.preventDefault();
      dz.classList.toggle('drag',ev==='dragover');
      if(ev==='drop')doPhotos(e.dataTransfer.files);
    });
  });
  bindPGrid();
}
function bindPGrid(){
  var gr=q('#pgrid');if(!gr)return;
  gr.addEventListener('input',function(e){
    if(!e.target.dataset.cap)return;
    var c=e.target.closest('[data-pid]');
    var p=(ST.cur.photos||[]).find(function(x){return x.id===c.dataset.pid;});
    if(p)p.caption=e.target.value;
  });
  gr.addEventListener('click',function(e){
    if(!e.target.dataset.prm)return;
    var c=e.target.closest('[data-pid]');
    ST.cur.photos=ST.cur.photos.filter(function(x){return x.id!==c.dataset.pid;});
    gr.innerHTML=photoHtml(ST.cur);
  });
}
async function doPhotos(files){
  files=Array.from(files).filter(function(f){return f.type.startsWith('image/');});
  var room=16-(ST.cur.photos||[]).length;
  if(room<=0){toast(false,'Maximum 16 photos.');return;}
  for(var i=0;i<Math.min(files.length,room);i++){
    try{var res=await compressImg(files[i]);ST.cur.photos.push({id:uid(),dataUrl:res.dataUrl,w:res.w,h:res.h,caption:''});}
    catch(e){toast(false,'Photo illisible.');}
  }
  var gr=q('#pgrid');if(gr){gr.innerHTML=photoHtml(ST.cur);bindPGrid();}
}

/* ===== PADS SIGNATURE ===== */
function initSig(id, field, existing){
  var cv=document.getElementById(id);if(!cv)return;
  var rc=cv.getBoundingClientRect();if(!rc.width||!rc.height)return;
  var ratio=window.devicePixelRatio||1;
  var fresh=cv.cloneNode(false);cv.parentNode.replaceChild(fresh,cv);cv=fresh;
  cv.width=rc.width*ratio;cv.height=rc.height*ratio;
  var ctx=cv.getContext('2d');
  ctx.scale(ratio,ratio);/* pas de fond : PNG transparent pour ne pas masquer le CERFA */
  ctx.strokeStyle='#1a2226';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';
  if(existing){var img=new Image();img.onload=function(){ctx.drawImage(img,0,0,rc.width,rc.height);};img.src=existing;}
  PADS[id]={ctx:ctx,drawing:false,lx:0,ly:0,hasInk:!!existing};
  function pos(e){var r=cv.getBoundingClientRect();return{x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,y:(e.touches?e.touches[0].clientY:e.clientY)-r.top};}
  function start(e){e.preventDefault();var p=pos(e);PADS[id].drawing=true;PADS[id].lx=p.x;PADS[id].ly=p.y;var h=cv.parentElement.querySelector('.shint');if(h)h.style.display='none';}
  function move(e){var pad=PADS[id];if(!pad.drawing)return;e.preventDefault();var p=pos(e);pad.ctx.beginPath();pad.ctx.moveTo(pad.lx,pad.ly);pad.ctx.lineTo(p.x,p.y);pad.ctx.stroke();pad.lx=p.x;pad.ly=p.y;pad.hasInk=true;}
  function stop(){var pad=PADS[id];if(!pad.drawing)return;pad.drawing=false;if(pad.hasInk)deepSet(ST.cur,field,cv.toDataURL('image/png'));}
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);cv.addEventListener('mouseup',stop);
  cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',stop);
}
function clearSig(id,field){
  var cv=document.getElementById(id);var pad=PADS[id];if(!cv||!pad)return;
  var rc=cv.getBoundingClientRect();pad.ctx.clearRect(0,0,rc.width,rc.height);
  pad.hasInk=false;deepSet(ST.cur,field,null);
  var h=cv.parentElement.querySelector('.shint');if(h)h.style.display='block';
}
function bindClr(){
  qa('[data-cc]').forEach(function(btn){
    if(btn._clr)return;btn._clr=true;
    btn.addEventListener('click',function(){clearSig(btn.dataset.cc,btn.dataset.cf);});
  });
}

/* ===== PDF ===== */
async function mailRapport(id, rapportObj){
  var r = rapportObj || await sGet('r:'+id);
  if(!r){ toast(false,'Rapport introuvable.'); return; }
  if(!window.jspdf){
    toast(true,'Pr\u00e9paration du PDF\u2026');
    var okLib = await ensureLib();
    if(!okLib){ toast(false,'Biblioth\u00e8que PDF indisponible. Connectez-vous une fois \u00e0 Internet.'); return; }
  }
  var doc;
  try{ doc = buildPdf(r); }
  catch(e){ console.error(e); toast(false,'Erreur lors de la g\u00e9n\u00e9ration du PDF.'); return; }
  var fname = (r.ref||'rapport')+'.pdf';
  var blob  = doc.output('blob');
  /* Même fenêtre que l'envoi automatique : destinataire pré-rempli et modifiable */
  proposerSuivi(r, blob, fname);
}


function validatePdf(r){
  var m=[];
  if(!r.site)m.push({t:'info',l:'Site'});
  if(!r.intervenant)m.push({t:'info',l:'Technicien'});
  if(!r.dateDebut)m.push({t:'info',l:'Jour de d\u00e9but'});
  if(!r.sigTech)m.push({t:'sig',l:'Signature du technicien'});
  if(!r.sigClient)m.push({t:'sig',l:'Signature du client'});
  return m;
}

async function handlePdf(){
  var r=ST.cur;
  var miss=validatePdf(r);
  if(miss.length){goTab(miss[0].t);toast(false,'Manquant : '+miss.map(function(m){return m.l;}).join(', ')+'.');return;}
  if(!window.jspdf){ toast(true,'Pr\u00e9paration du PDF\u2026'); var okLib=await ensureLib(); if(!okLib){toast(false,'Biblioth\u00e8que PDF indisponible. Connectez-vous une fois \u00e0 Internet.');return;} }
  await save(false);
  try{
    var doc=buildPdf(r);
    var blob=doc.output('blob');
    var fname=(r.ref||'rapport')+'.pdf';
    var url=URL.createObjectURL(blob);
    showPreview(url,fname);
    toast(true,'PDF g\u00e9n\u00e9r\u00e9.');
    /* Proposer l'envoi pour tout rapport généré */
    if(ST.cfg.suiviAuto!==false){
      setTimeout(function(){ proposerSuivi(r,blob,fname); },700);
    }
  }catch(e){console.error(e);toast(false,'Erreur lors de la g\u00e9n\u00e9ration du PDF.');}
}

/* ===== CONSTRUCTION PDF RAPPORT ===== */
function buildPdf(report){
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({unit:'mm',format:'a4'});
  var PW=210,PH=297,M=14,CW=PW-M*2;
  var y=M;

  var FT_RAW=(ST.cfg.footer||CO_ADDR+'\n'+CO_LEGAL).split('\n').join(' \u2022 ');
  function foot(){
    var pn=doc.internal.getNumberOfPages();
        doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(90,90,90);
    var ftLines=doc.splitTextToSize(FT_RAW,CW);
    var ftY=PH-11.5;
    ftLines.forEach(function(l){doc.text(l,PW/2,ftY,{align:'center'});ftY+=3;});
    doc.setFontSize(6.5);doc.setTextColor(140,140,140);
    doc.text(report.ref||'',M,PH-5.5);
    doc.text('p.'+pn,PW-M,PH-5.5,{align:'right'});
  }
  function np(){foot();doc.addPage();y=M;}
  function need(h){if(y+h>PH-M-12)np();}
  function sec(lbl){
    need(12);doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(32,38,42);
    doc.text(lbl.toUpperCase(),M,y);
    doc.setDrawColor(0,70,160);doc.setLineWidth(.5);doc.line(M,y+2,M+CW,y+2);
    y+=9;
  }
  function para(txt){
    doc.setFont('helvetica','normal');doc.setFontSize(9.8);doc.setTextColor(38,47,51);
    var ls=doc.splitTextToSize(txt&&txt.trim()?txt:'\u2014',CW);
    ls.forEach(function(l){need(5.5);doc.text(l,M,y);y+=5.5;});y+=3;
  }
  function chkb(x,cy,ok){
    doc.setDrawColor(130,130,130);doc.setLineWidth(.3);doc.rect(x,cy-2.5,3,3);
    if(ok){
      /* Dessiner un ✓ avec des lignes vectorielles (Helvetica ne supporte pas U+2713) */
      doc.setDrawColor(0,70,160);doc.setLineWidth(.65);
      /* Branche courte gauche */
      doc.line(x+0.4,cy-0.9,x+1.1,cy+0.1);
      /* Branche longue droite */
      doc.line(x+1.1,cy+0.1,x+2.7,cy-2.2);
      doc.setDrawColor(130,130,130);doc.setLineWidth(.3);
    }
  }

  /* ── En-tête ── */
  /* En-tête blanc avec bordure ambre */
  doc.setFillColor(255,255,255);doc.rect(0,0,PW,26,'F');
  doc.setDrawColor(0,70,160);doc.setLineWidth(.8);doc.line(0,26,PW,26);
  var lh=12,lr=500/129,lw=lh*lr;if(lw>55){lw=55;lh=lw/lr;}
  /* Logo centré verticalement avec le titre */
  try{doc.addImage(LOGO_B64,'PNG',M,(26-lh)/2,lw,lh);}catch(e){}
  /* Titre aligné verticalement avec le logo */
  var titleY=13;
  doc.setTextColor(20,20,20);doc.setFont('helvetica','bold');doc.setFontSize(13.5);
  doc.text("RAPPORT D'INTERVENTION",M+lw+8,titleY);
  doc.setFont('courier','bold');doc.setFontSize(11);doc.setTextColor(0,70,160);
  doc.text(report.ref||'',PW-M,titleY,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(100,100,100);
  doc.text(fmtRange(report),PW-M,titleY+5.5,{align:'right'});
  doc.setTextColor(20,20,20);
  y=34;

  /* ── Identification ── */
  var HW=(CW-8)/2,sy=y;
  var leftF=[['Site',report.site],['Technicien',report.intervenant],['Type',(report.typesI&&report.typesI.length?report.typesI.join(', '):'\u2014')]];
  var rightF=[['Statut',report.statut],['Date',fmtRange(report)],['Temps pass\u00e9',durée(report)||'\u2014']];
  function drawCol(fields,x){var cy=sy;fields.forEach(function(f){doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(107,115,120);doc.text(f[0].toUpperCase(),x,cy);doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(38,47,51);var ls=doc.splitTextToSize(f[1]||'\u2014',HW);doc.text(ls,x,cy+4.5);cy+=4.5+ls.length*4.8+3;});return cy;}
  var ly=drawCol(leftF,M),ry=drawCol(rightF,M+HW+8);
  y=Math.max(ly,ry)+4;
  doc.setDrawColor(220,209,176);doc.setLineWidth(.4);doc.line(M,y,M+CW,y);y+=8;

  /* ── Checklist ── */
  sec('Maintenance pr\u00e9ventive');need(48);
  var cc=(CW-10)/2,csy=y;
  function drawCL(title,items,data,x){
    var cy=csy;
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(38,47,51);doc.text(title.toUpperCase(),x,cy);
    doc.setDrawColor(220,209,176);doc.setLineWidth(.4);doc.line(x,cy+2,x+cc,cy+2);cy+=7;
    items.forEach(function(it){
      chkb(x,cy,!!(data&&data[it.k]));
      doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(38,47,51);
      var ls=doc.splitTextToSize(it.l,cc-7);doc.text(ls,x+6,cy);cy+=Math.max(5,ls.length*4+.5);
    });
    return cy;
  }
  var nl=drawCL('Nettoyage',NET,report.clN,M),nr=drawCL('Contr\u00f4le',CTR,report.clC,M+cc+10);
  y=Math.max(nl,nr)+4;
  if(report.tempVal){
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(38,47,51);
    doc.text((report.tempType==='eau'?"Temp\u00e9rature d\u00e9part d'eau":'Temp\u00e9rature de soufflage')+' : '+report.tempVal+' \u00b0C',M,y);
    y+=9;
  }else y+=3;

  /* ── Intervention ── */
  sec("Descriptif de l'intervention");para(report.descriptif);
  if(report.fournitures&&report.fournitures.trim()){sec('Fournitures utilis\u00e9es');para(report.fournitures);}
  if(report.obsClient&&report.obsClient.trim()){sec('Observations client');para(report.obsClient);}

  /* ── Photos ── */
  if(report.photos&&report.photos.length){
    sec('Photos');
    var gap=6,pw=(CW-gap)/2,col=0,ry2=y,rh=0;
    report.photos.forEach(function(ph,idx){
      var ratio=ph.h&&ph.w?ph.h/ph.w:.75;
      var iw=pw,ih=iw*ratio;if(ih>70){ih=70;iw=ih/ratio;}
      /* Hauteur réservée à la légende, calculée sur le nombre de lignes */
      var capLines=[];
      if(ph.caption && String(ph.caption).trim()){
        doc.setFont('helvetica','italic');doc.setFontSize(8);
        capLines=doc.splitTextToSize(String(ph.caption).trim(),pw-1);
      }
      var capH = capLines.length ? capLines.length*3.6+2.5 : 0;
      var bh = ih + capH + 7;
      if(col===0){need(bh);ry2=y;rh=bh;}else rh=Math.max(rh,bh);
      var px=M+col*(pw+gap);
      try{doc.addImage(ph.dataUrl,'JPEG',px,ry2,iw,ih);}catch(e){}
      if(capLines.length){
        doc.setFont('helvetica','italic');doc.setFontSize(8);doc.setTextColor(90,98,103);
        capLines.forEach(function(l,li){ doc.text(l,px,ry2+ih+4.2+li*3.6); });
        doc.setTextColor(38,47,51);
      }
      if(col===1||idx===report.photos.length-1){y=ry2+rh;col=0;}else col=1;
    });y+=3;
  }

  /* ── Signatures ── */
  sec('Signatures');need(40);
  var sw=(CW-10)/2;
  doc.setDrawColor(220,209,176);doc.setLineWidth(.5);
  doc.rect(M,y,sw,34);doc.rect(M+sw+10,y,sw,34);
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(38,47,51);
  doc.text('Technicien',M+3,y+6);doc.text('Client',M+sw+13,y+6);
  if(report.sigTech){try{doc.addImage(report.sigTech,'PNG',M+3,y+8,sw-6,18);}catch(e){}}
  if(report.sigClient){try{doc.addImage(report.sigClient,'PNG',M+sw+13,y+8,sw-6,18);}catch(e){}}
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(107,115,120);
  doc.text(report.intervenant||'\u2014',M+3,y+30);
  doc.text(report.nomClient||'\u2014',M+sw+13,y+30);
  y+=38;

  /* Le pied de page est géré uniquement par foot() sur chaque page */

  /* ── Annexe CERFA ── */
  var fiches=cerfasActives(report);
  if(fiches.length){
    fiches.forEach(function(fc){
      foot();          /* finalise la page précédente */
      doc.addPage();   /* une page par fiche CERFA */
      buildCerfa(doc,fc);
    });
    foot();
  } else {
    foot();
  }
  return doc;
}

/* ===== CERFA : fond officiel + overlay ===== */
function buildCerfa(doc, c){
  /* CERFA 15497*04 — cases centrées sur les carrés détectés du formulaire */
  var PW=210, PH=297;
  try{doc.addImage(CERFA_BG_B64,'JPEG',0,0,PW,PH);}catch(e){}

  function v(val,x,y,maxW,sz){
    if(!val&&val!==0)return;
    doc.setFont('helvetica','normal');
    doc.setFontSize(sz||7.5);
    doc.setTextColor(0,0,170);
    doc.text(doc.splitTextToSize(String(val),maxW||40),x,y);
    doc.setTextColor(0,0,0);
  }
  /* X centré sur le carré : (cx,cy) = centre du carré */
  function X(cx,cy,ok){
    if(!ok)return;
    var r=1.1;
    doc.setDrawColor(0,0,170);doc.setLineWidth(0.5);
    doc.line(cx-r,cy-r,cx+r,cy+r);
    doc.line(cx+r,cy-r,cx-r,cy+r);
    doc.setDrawColor(0,0,0);
  }
  function O(cx,cy,ok){
    if(!ok)return;
    doc.setFillColor(0,0,170);doc.circle(cx,cy,1.1,'F');doc.setFillColor(0,0,0);
  }
  function fd(iso){if(!iso)return'';var p=iso.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;}
  function dp(iso){if(!iso)return null;var p=iso.split('-');return p.length===3?{d:p[2],m:p[1],y:p[0]}:null;}

  var nat=c.nature||{}, qf=c.qFluide||{}, fu=c.fuites||[];

  /* ─ Fiche N° / attestation ─ */
  v(c.ficheNum, 15, 39, 26, 7);
  v(c.attest||'4019502', 76, 53, 42, 7.5);
  /* ─ [1] Opérateur / [2] Détenteur ─ */
  v(c.op||CERFA_OP, 45, 37, 73, 6.8);
  v(c.det, 122, 37, 73, 6.8);
  /* ─ [3] Identification ─ */
  v(c.equipIdent, 45.5, 65, 73, 7.5);

  /* ─ Dénomination du fluide : case x=170.2-192.8, ligne y≈58 ─ */
  v(c.fluideDenom, 172, 59.5, 20, 7);
  /* ─ Charge totale : case x=167-189.4, ligne y≈63 ─ */
  v(c.chargeTot, 169, 65, 19, 7);
  /* ─ Tonnage CO2 : case x=167-182, ligne y≈68 ─ */
  v(c.tonnCO2, 169, 70, 13, 7);

  /* ─ [4] Nature : carrés centrés x=56.7 / 117.8, y=73.3 / 77.9 / 82.7 / 87.6 ─ */
  X(56.7,  73.3, !!nat.assemblage);
  X(56.7,  77.9, !!nat.miseEnService);
  X(56.7,  82.7, !!nat.modification);
  X(56.7,  87.6, !!nat.maintenance);
  X(117.8, 73.3, !!nat.ctrlPeriod);
  X(117.8, 77.9, !!nat.ctrlNonPeriod);
  X(117.8, 82.7, !!nat.demantelement);
  X(117.8, 87.6, !!nat.autre);
  if(nat.autre&&c.natureAutre) v(c.natureAutre, 152, 88.5, 44, 7);

  /* ─ [5] Détecteur ─ */
  v(c.detectIdent, 76, 100, 58, 7.5);
  var d5 = dp(c.detectDate);
  if(d5){
    v(d5.d, 152.5, 100, 8, 7.5);
    v(d5.m, 163.5, 100, 8, 7.5);
    v(d5.y, 175,   100, 11, 7.5);
  }

  /* ─ [6] OUI / NON ─ */
  O(126.8, 113.5, c.sysPerm==='oui');
  O(160.2, 113.5, c.sysPerm==='non');

  /* ─ [7] Quantité fluide : carrés x=108.8 / 139.4 / 170.1
         rows y=114.4 (HCFC) / 118.6 (HFC-PFC) / 123.7 (HFO) ─ */
  X(108.8, 114.4, !!qf.hcfc_0);   X(139.4, 114.4, !!qf.hcfc_1);   X(170.1, 114.4, !!qf.hcfc_2);
  X(108.8, 118.6, !!qf.hfcpfc_0); X(139.4, 118.6, !!qf.hfcpfc_1); X(170.1, 118.6, !!qf.hfcpfc_2);
  X(108.8, 123.7, !!qf.hfo_0);    X(139.4, 123.7, !!qf.hfo_1);    X(170.1, 123.7, !!qf.hfo_2);

  /* ─ [8] y=128.2  /  [9] y=133.0 ─ */
  X(108.8, 128.2, c.freqSans==='12');
  X(139.4, 128.2, c.freqSans==='6');
  X(170.1, 128.2, c.freqSans==='3');
  X(108.8, 133.0, c.freqAvec==='24');
  X(139.4, 133.0, c.freqAvec==='12');
  X(170.1, 133.0, c.freqAvec==='6');

  /* ─ [10] Fuites : OUI y=154.6 / NON y=158.4 à x=24.3 ─ */
  X(24.3, 154.6, c.fuitesConst==='oui');
  X(24.3, 158.4, c.fuitesConst==='non');

  /* Réparation : carrés x=175.1
     Réalisée : y=141.2 / 149.2 / 156.5
     A faire  : y=145.0 / 152.9 / 160.3 */
  var realY=[141.2,149.2,156.5], afaY=[145.0,152.9,160.3];
  var locY =[144.5,152.3,160.0];
  [0,1,2].forEach(function(i){
    var f = fu[i] || {loc:'', rep:''};
    v(f.loc, 61, locY[i], 103, 7.5);
    X(175.1, realY[i], f.rep==='realisee');
    X(175.1, afaY[i],  f.rep==='afaire');
